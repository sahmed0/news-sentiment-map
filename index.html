<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <title>World News Sentiment | Sajid Ahmed</title>
    <meta name="description" content="An interactive world map coloured by the sentiment of each country's latest news headlines, refreshed hourly from live news APIs and scored with a RoBERTa sentiment model." />

    <!-- Open Graph / Twitter Card - so sharing the link (LinkedIn, Twitter, Slack)
         renders a real preview card instead of a bare link. og:image must be an
         absolute URL for crawlers to fetch it. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://news.sajidahmed.co.uk/" />
    <meta property="og:title" content="World News Sentiment" />
    <meta property="og:description" content="The emotional temperature of global headlines - an interactive world map of live news sentiment, refreshed hourly." />
    <meta property="og:image" content="https://news.sajidahmed.co.uk/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="750" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="World News Sentiment" />
    <meta name="twitter:description" content="The emotional temperature of global headlines - an interactive world map of live news sentiment, refreshed hourly." />
    <meta name="twitter:image" content="https://news.sajidahmed.co.uk/og-image.jpg" />

    <!-- Apply the saved theme to <html> before paint so the html/body background
         (which fills the iOS safe-area below the bottom bar) matches the map and
         doesn't flash. Mirrors the "light" default in src/hooks/useTheme.ts. -->
    <script>
      try {
        if (localStorage.getItem("nsm-theme") !== "dark") {
          document.documentElement.classList.add("theme-light");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
