name: Eval output
# Re-derives the committed eval/out results. Slow, and only eval/ changes can
# break it, so it runs here instead of in the main CI job.
on:
  push:
    branches: [main]
    paths:
      - "eval/**"
      - "src/lib/sentiment.ts"
      - "shared/**"
      - "test/eval/committed-output.test.ts"
      - "vitest.eval-output.config.ts"
      - ".github/workflows/eval-output.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "eval/**"
      - "src/lib/sentiment.ts"
      - "shared/**"
      - "test/eval/committed-output.test.ts"
      - "vitest.eval-output.config.ts"
      - ".github/workflows/eval-output.yml"
      - "pnpm-lock.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eval-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version comes from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:eval-output
